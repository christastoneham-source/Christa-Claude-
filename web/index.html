<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Family Property Roadmap — Houston Land Bank</title>
<meta name="description" content="An educational navigation tool for Harris County families dealing with heirs' property, probate, title, taxes, and home preservation. A Houston Land Bank pilot. Not legal advice." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    /* Houston Land Bank brand */
    --hlb-turq:#0099a8; --hlb-turq-dark:#007a86; --hlb-green:#00ae8d;
    --hlb-yellowgreen:#c2d500; --hlb-yellow:#e0cc00; --hlb-orange:#ff8300; --hlb-redorange:#ff4713;
    --brand:var(--hlb-turq); --brand-dark:var(--hlb-turq-dark); --brand-soft:#e2f4f6;
    --ink:#11343a; --muted:#52666b; --line:#d8e6e8; --bg:#f4f8f9; --card:#ffffff;
    --warn:#9a3409; --warn-bg:#fff1e8; --warn-line:#ffcdab;
    --focus:#0099a8; --maxw:760px; --radius:14px;
    --shadow:0 1px 2px rgba(0,60,66,.06),0 8px 24px rgba(0,60,66,.07);
    --font:"Rubik",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font); color:var(--ink); background:var(--bg); line-height:1.55; font-size:17px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 18px}
  a{color:var(--brand-dark)}
  h1,h2,h3{line-height:1.25; color:var(--ink); font-weight:700}
  h1{font-size:1.7rem; margin:.2em 0 .4em}
  h2{font-size:1.3rem; margin:1.3em 0 .5em}
  h3{font-size:1.08rem; margin:1.1em 0 .4em}
  p{margin:.5em 0}
  .small{font-size:.9rem; color:var(--muted)}
  header.bar{background:var(--brand); color:#fff; padding:11px 0}
  header.bar .wrap{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .wordmark{font-weight:500; font-size:1.18rem; letter-spacing:.2px; color:#fff; text-transform:lowercase}
  .wordmark b{font-weight:900}
  .topright{display:flex; align-items:center; gap:14px}
  .langtoggle{font-size:.82rem; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.4); color:#fff; border-radius:99px; padding:4px 10px; cursor:pointer}
  .langtoggle:hover{background:rgba(255,255,255,.28)}
  .disclaimer{background:#e7f3f4; border-bottom:1px solid var(--line); color:var(--muted); font-size:.85rem}
  .disclaimer .wrap{padding:8px 18px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; margin:18px 0}
  .pad{padding:18px 0 40px}
  .btn{display:inline-block; border:0; border-radius:10px; padding:13px 20px; font-size:1rem; font-weight:600; cursor:pointer; text-decoration:none; text-align:center; font-family:inherit}
  .btn-primary{background:var(--brand); color:#fff}
  .btn-primary:hover{background:var(--brand-dark)}
  .btn-ghost{background:#fff; color:var(--brand-dark); border:1.5px solid var(--brand)}
  .btn-ghost:hover{background:var(--brand-soft)}
  .btn-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px}
  .btn:disabled{opacity:.5; cursor:not-allowed}
  .opt{display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:13px 15px; margin:8px 0; font-size:1rem; cursor:pointer; color:var(--ink); font-family:inherit}
  .opt:hover{border-color:var(--brand)}
  .opt:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
  .opt.sel{border-color:var(--brand); background:var(--brand-soft); font-weight:600}
  .opt .chk{color:var(--brand); font-weight:700; margin-right:6px}
  input[type=text],textarea{width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px; font-size:1rem; font-family:inherit}
  input[type=text]:focus,textarea:focus{outline:3px solid var(--focus); outline-offset:1px; border-color:var(--brand)}
  label.q{display:block; font-weight:600; font-size:1.15rem; margin-bottom:4px}
  .help{color:var(--muted); font-size:.92rem; margin:.2em 0 1em}
  .progress{height:8px; background:#dfeaec; border-radius:99px; overflow:hidden; margin:14px 0 4px}
  .progress > div{height:100%; background:var(--brand); width:0; transition:width .3s ease}
  .progress-label{font-size:.82rem; color:var(--muted); margin-bottom:6px}
  .notice{border-radius:12px; padding:14px 16px; margin:14px 0; font-size:.95rem}
  .notice.warn{background:var(--warn-bg); border:1px solid var(--warn-line); color:var(--warn)}
  .notice.info{background:var(--brand-soft); border:1px solid #bfe6ea; color:var(--brand-dark)}
  .notice.pilot{background:#f3faf4; border:1px solid #c7e9c0; color:#2c5f2d}
  .pill{display:inline-block; background:var(--brand-soft); color:var(--brand-dark); border:1px solid #bfe6ea; border-radius:99px; padding:3px 11px; font-size:.82rem; font-weight:600; margin:3px 4px 0 0}
  .pill.urgent{background:var(--warn-bg); border-color:var(--warn-line); color:var(--warn)}
  ul.tight{margin:.4em 0; padding-left:1.2em}
  ul.tight li{margin:.3em 0}
  .kv{margin:.3em 0}
  .kv b{display:inline-block; min-width:150px; color:var(--muted); font-weight:600; font-size:.9rem}
  .grid2{display:grid; grid-template-columns:1fr; gap:14px}
  .feature{display:flex; gap:12px; align-items:flex-start}
  .feature .dot{flex:0 0 auto; width:30px; height:30px; border-radius:8px; background:var(--brand-soft); color:var(--brand-dark); display:flex; align-items:center; justify-content:center; font-weight:700}
  hr{border:0; border-top:1px solid var(--line); margin:22px 0}
  footer.site{border-top:3px solid var(--hlb-yellowgreen); background:#fff; color:var(--muted); font-size:.85rem; padding:18px 0; margin-top:30px}
  footer.site .wm{color:var(--brand); font-weight:900; text-transform:lowercase}
  .center{text-align:center}
  .back{background:none; border:0; color:var(--muted); cursor:pointer; font-size:.95rem; padding:6px 0; font-family:inherit}
  .roadmap h2{border-bottom:2px solid var(--brand-soft); padding-bottom:4px}
  .num{display:inline-flex; width:26px; height:26px; background:var(--brand); color:#fff; border-radius:50%; align-items:center; justify-content:center; font-size:.85rem; font-weight:700; margin-right:8px}
  @media(min-width:620px){ .grid2{grid-template-columns:1fr 1fr} }
  @media print{
    header.bar,.disclaimer,.no-print,footer.site,.langtoggle{display:none!important}
    body{background:#fff; font-size:12pt}
    .card{box-shadow:none; border:1px solid #ccc; page-break-inside:avoid}
  }
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <span class="wordmark">houston<b>landbank</b></span>
  <span class="topright">
    <button class="langtoggle" id="langBtn" onclick="toggleLang()">Español</button>
  </span>
</div></header>
<div class="disclaimer"><div class="wrap" id="disclaimerBar"></div></div>

<main class="wrap pad" id="app" aria-live="polite"></main>

<footer class="site"><div class="wrap" id="siteFooter"></div></footer>

<script>
/* =========================================================================
   Houston Land Bank — Harris County Heirs' Property Navigator
   Self-contained bilingual (EN/ES) MVP. No backend; answers stay in browser.
   No scores, no legal conclusions, no ownership/heirship determinations.
   ========================================================================= */

const A = document.getElementById('app');
const LS_KEY = 'hlb_hcppn_v2';
const ans = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
let L = ans._lang || 'en';
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(ans)); }
function set(id,val){ ans[id]=val; save(); }
function get(id){ return ans[id]; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function scrollTop(){ window.scrollTo({top:0,behavior:'smooth'}); }
function tr(en,es){ return L==='es'? es : en; }

/* ---- Canonical legal strings (bilingual) ---- */
const CORE_DISCLAIMER = {
 en:"This tool provides general education and navigation support for Harris County residents. It is not legal advice, does not create an attorney-client relationship, and should not be relied upon to make legal decisions. For advice about your specific situation, please speak with a licensed Texas attorney.",
 es:"Esta herramienta ofrece educación general y apoyo de orientación para residentes del Condado de Harris. No es asesoría legal, no crea una relación abogado-cliente y no debe usarse para tomar decisiones legales. Para asesoría sobre su situación específica, hable con un abogado con licencia en Texas."};
const FRAMING = {
 en:"I can help you understand what issues may be present, what records may be needed, what public offices or partners may be involved, and what questions you may want to ask a licensed Texas attorney. I cannot provide legal advice, determine ownership, determine heirship, or tell you what legal action to take.",
 es:"Puedo ayudarle a entender qué asuntos pueden estar presentes, qué documentos pueden necesitarse, qué oficinas públicas o socios pueden estar involucrados, y qué preguntas hacerle a un abogado con licencia en Texas. No puedo dar asesoría legal, determinar la propiedad, determinar quiénes son los herederos, ni decirle qué acción legal tomar."};
const ESCALATION = {
 en:"Because you mentioned a notice, court paper, tax issue, foreclosure risk, or pressure to sign documents, this may require urgent review by a licensed attorney or qualified legal aid organization. This tool cannot tell you what legal action to take, but it can help you organize records and questions to bring to a professional as soon as possible.",
 es:"Como usted mencionó un aviso, un documento judicial, un problema de impuestos, riesgo de ejecución hipotecaria o presión para firmar documentos, esto puede requerir revisión urgente por un abogado con licencia o una organización de asistencia legal calificada. Esta herramienta no puede decirle qué acción legal tomar, pero puede ayudarle a organizar documentos y preguntas para llevar a un profesional lo antes posible."};
const CLOSING = {
 en:"You do not have to resolve every issue at once. The first step is understanding what is known, what is missing, and who can help. This roadmap is designed to help you prepare for informed conversations with qualified professionals and public agencies.",
 es:"No tiene que resolver todo de una sola vez. El primer paso es entender qué se sabe, qué falta y quién puede ayudar. Esta guía está diseñada para ayudarle a prepararse para conversaciones informadas con profesionales calificados y agencias públicas."};

/* ---- Universal option sets (English = canonical answer values) ---- */
const STD = ["Yes","No","I do not know","I need help finding this","This does not apply","I want to skip this"];
const LIV = ["Living","Deceased","I do not know"];
const OCC = ["Occupied","Vacant","Rented","Abandoned","Damaged","I'm not sure"];
const TYP = ["A home","Vacant lot","Multifamily","Commercial","Church-owned","Other"];
const TAX = ["Current","Delinquent (behind)","I do not know"];

/* ---- Option label translations (canonical EN -> ES) ---- */
const OPT_ES = {
 "Yes":"Sí","No":"No","I do not know":"No lo sé","I need help finding this":"Necesito ayuda para encontrarlo",
 "This does not apply":"No aplica","I want to skip this":"Quiero omitir esto",
 "Living":"Vive (con vida)","Deceased":"Falleció",
 "Occupied":"Ocupada","Vacant":"Vacía","Rented":"Rentada","Abandoned":"Abandonada","Damaged":"Dañada","I'm not sure":"No estoy seguro/a",
 "A home":"Una casa","Vacant lot":"Un lote vacío","Multifamily":"Multifamiliar","Commercial":"Comercial","Church-owned":"Propiedad de una iglesia","Other":"Otro",
 "Current":"Al corriente","Delinquent (behind)":"Atrasados (en mora)",
 "Will":"Testamento","Trust":"Fideicomiso","Death certificate":"Acta de defunción","Probate case number":"Número de caso de sucesión (probate)",
 "Court order":"Orden judicial","Executor paperwork":"Documentos del albacea","Administrator paperwork":"Documentos del administrador",
 "Small estate affidavit":"Declaración jurada de patrimonio pequeño","Affidavit of heirship":"Declaración jurada de herederos",
 "Transfer on death deed":"Escritura de transferencia al fallecer","Life estate deed":"Escritura de usufructo vitalicio",
 "Family agreement":"Acuerdo familiar","Attorney paperwork":"Documentos de un abogado","None of these yet":"Ninguno todavía",
 "Keep the family home":"Conservar la casa familiar","Understand who owns the property":"Entender quién es el dueño",
 "Find the deed":"Encontrar la escritura","Find probate records":"Encontrar registros de sucesión (probate)",
 "Apply for an exemption":"Solicitar una exención","Stop tax delinquency":"Detener la mora de impuestos",
 "Avoid foreclosure or tax sale":"Evitar ejecución hipotecaria o venta por impuestos","Clear title":"Aclarar el título de propiedad",
 "Repair the property":"Reparar la propiedad","Sell the property":"Vender la propiedad","Transfer the property":"Transferir la propiedad",
 "Redevelop the property":"Reurbanizar la propiedad","Protect the property for the next generation":"Proteger la propiedad para la próxima generación",
 "Resolve family disagreement":"Resolver un desacuerdo familiar","Talk to legal aid":"Hablar con asistencia legal",
 "Talk to an attorney":"Hablar con un abogado","I do not know where to start":"No sé por dónde empezar"
};
function optLabel(o){ return L==='es' ? (OPT_ES[o]||o) : o; }

/* ---- UI string table ---- */
const T = {
 disclaimer:{en:"Educational only — <strong>not legal advice</strong> and not a substitute for a licensed Texas attorney.",
             es:"Solo educativo — <strong>no es asesoría legal</strong> ni un sustituto de un abogado con licencia en Texas."},
 backNext:{en:["← Back","Skip / Next →","Next →"], es:["← Atrás","Omitir / Siguiente →","Siguiente →"]},
 step:{en:(a,b)=>`Step ${a} of ${b}. Your answers are saved automatically on this device.`,
       es:(a,b)=>`Paso ${a} de ${b}. Sus respuestas se guardan automáticamente en este dispositivo.`},
};

/* =========================================================================
   QUESTION MODEL (q/help/intro/title carry _es; answers stored in EN)
   ========================================================================= */
const ownerLiving   = a => a.s3_living === 'Living';
const ownerDeceased = a => a.s3_living === 'Deceased' || a.s3_living === 'I do not know';

const SECTIONS = [
 { key:'s2', title:'Property Location', title_es:'Ubicación de la propiedad',
   intro:'A few questions about where the property is. "I don\'t know" is always okay.',
   intro_es:'Unas preguntas sobre dónde está la propiedad. "No lo sé" siempre está bien.',
   qs:[
    {id:'s2_county', q:'Is the property in Harris County, Texas?', q_es:'¿La propiedad está en el Condado de Harris, Texas?', help:'If it\'s in another county, we can still share general information, but the offices and records there may be different.', help_es:'Si está en otro condado, podemos compartir información general, pero las oficinas y registros pueden ser diferentes.', type:'single', opts:STD},
    {id:'s2_addr', q:'What is the property address?', q_es:'¿Cuál es la dirección de la propiedad?', help:'Street, city, ZIP. You can skip if you\'re not sure.', help_es:'Calle, ciudad, código postal. Puede omitir si no está seguro.', type:'text', ph:'e.g., 123 Example St, Houston, TX 77026'},
    {id:'s2_houston', q:'Is the property inside the City of Houston?', q_es:'¿La propiedad está dentro de la Ciudad de Houston?', type:'single', opts:STD},
    {id:'s2_kg', q:'Is the property in Kashmere Gardens or Super Neighborhood 52?', q_es:'¿La propiedad está en Kashmere Gardens o Super Neighborhood 52?', help:'This helps us connect you with the closest local resources.', help_es:'Esto nos ayuda a conectarle con los recursos locales más cercanos.', type:'single', opts:STD},
    {id:'s2_occ', q:'Right now, is the property…', q_es:'En este momento, la propiedad está…', type:'single', opts:OCC},
    {id:'s2_type', q:'What kind of property is it?', q_es:'¿Qué tipo de propiedad es?', type:'single', opts:TYP},
   ]},
 { key:'s3', title:'Current Owner Status', title_es:'Estado del dueño actual',
   intro:'This helps us understand the most important part of your situation.',
   intro_es:'Esto nos ayuda a entender la parte más importante de su situación.',
   qs:[
    {id:'s3_owner', q:'Who is listed as the owner, if you know?', q_es:'¿Quién aparece como dueño, si lo sabe?', help:'A name is fine. Skip if unsure.', help_es:'Un nombre está bien. Omita si no está seguro.', type:'text', ph:'Name (optional)'},
    {id:'s3_living', q:'Is that person living or deceased?', q_es:'¿Esa persona vive o falleció?', type:'single', opts:LIV},
    {id:'s3_isowner', q:'Are you the listed owner?', q_es:'¿Usted es el dueño que aparece?', type:'single', opts:STD},
    {id:'s3_related', q:'Are you related to the listed owner?', q_es:'¿Usted es familiar del dueño que aparece?', type:'single', opts:STD},
    {id:'s3_live', q:'Do you live in the property?', q_es:'¿Usted vive en la propiedad?', type:'single', opts:STD},
    {id:'s3_estate', q:'Is the property listed as "in the estate of" someone?', q_es:'¿La propiedad aparece como "in the estate of" (en la sucesión de) alguien?', help:'You might see this on a tax statement or HCAD record.', help_es:'Puede verlo en un estado de cuenta de impuestos o en un registro de HCAD.', type:'single', opts:STD},
    {id:'s3_deed', q:'Do you know whether the deed has been updated since the owner\'s situation changed?', q_es:'¿Sabe si la escritura se ha actualizado desde que cambió la situación del dueño?', type:'single', opts:STD},
   ]},
 { key:'s4', title:'Planning Ahead (Owner Is Living)', title_es:'Planear con tiempo (el dueño vive)',
   intro:'Because the owner is living, this is a chance to plan ahead and prevent future problems.',
   intro_es:'Como el dueño vive, esta es una oportunidad para planear y prevenir problemas futuros.',
   visibleSec: ownerLiving,
   qs:[
    {id:'s4_will', q:'Does the owner have a will?', q_es:'¿El dueño tiene un testamento?', type:'single', opts:STD},
    {id:'s4_trust', q:'Does the owner have a trust?', q_es:'¿El dueño tiene un fideicomiso?', type:'single', opts:STD},
    {id:'s4_named', q:'Has the owner named who should receive the property?', q_es:'¿El dueño ha nombrado quién debe recibir la propiedad?', type:'single', opts:STD},
    {id:'s4_tod', q:'Has the owner thought about a transfer on death deed or another planning tool?', q_es:'¿El dueño ha pensado en una escritura de transferencia al fallecer u otra herramienta de planeación?', help:'A transfer on death deed can name who gets the property automatically — an attorney can explain if it fits.', help_es:'Una escritura de transferencia al fallecer puede nombrar quién recibe la propiedad automáticamente — un abogado puede explicar si conviene.', type:'single', opts:STD},
    {id:'s4_hs', q:'Does the owner have a homestead exemption?', q_es:'¿El dueño tiene exención de vivienda principal (homestead)?', type:'single', opts:STD},
    {id:'s4_otherex', q:'Does the owner have an over-65, disability, veteran, or other exemption?', q_es:'¿El dueño tiene exención de mayores de 65, discapacidad, veterano u otra?', type:'single', opts:STD},
    {id:'s4_records', q:'Does the family know where the deed and property records are kept?', q_es:'¿La familia sabe dónde se guardan la escritura y los documentos de la propiedad?', type:'single', opts:STD},
    {id:'s4_wishes', q:'Are family members aware of the owner\'s wishes?', q_es:'¿Los familiares conocen los deseos del dueño?', type:'single', opts:STD},
   ]},
 { key:'s5', title:'If the Owner Has Passed Away', title_es:'Si el dueño ha fallecido',
   intro:'We\'re sorry for your loss. These questions help us understand what records may exist. "I don\'t know" is completely okay.',
   intro_es:'Lamentamos su pérdida. Estas preguntas nos ayudan a entender qué documentos pueden existir. "No lo sé" está bien.',
   visibleSec: ownerDeceased,
   qs:[
    {id:'s5_dod', q:'About when did the owner pass away?', q_es:'¿Aproximadamente cuándo falleció el dueño?', help:'A year is fine.', help_es:'Un año está bien.', type:'text', ph:'e.g., 2018 (optional)'},
    {id:'s5_will', q:'Was there a will?', q_es:'¿Había un testamento?', type:'single', opts:STD},
    {id:'s5_orig', q:'Is the original will available?', q_es:'¿Está disponible el testamento original?', type:'single', opts:STD},
    {id:'s5_filed', q:'Was the will filed with a court?', q_es:'¿El testamento se presentó ante un tribunal?', type:'single', opts:STD},
    {id:'s5_probate', q:'Was probate opened?', q_es:'¿Se abrió un proceso de sucesión (probate)?', help:'Probate is the court process for handling someone\'s estate.', help_es:'La sucesión (probate) es el proceso judicial para manejar el patrimonio de una persona.', type:'single', opts:STD},
    {id:'s5_exec', q:'Was anyone named executor or administrator?', q_es:'¿Se nombró a alguien albacea o administrador?', type:'single', opts:STD},
    {id:'s5_trust', q:'Was there a trust?', q_es:'¿Había un fideicomiso?', type:'single', opts:STD},
    {id:'s5_tod', q:'Was there a transfer on death deed?', q_es:'¿Había una escritura de transferencia al fallecer?', type:'single', opts:STD},
    {id:'s5_aoh', q:'Was there an affidavit of heirship?', q_es:'¿Había una declaración jurada de herederos (affidavit of heirship)?', help:'A sworn statement about family history sometimes used for property.', help_es:'Una declaración jurada sobre la historia familiar que a veces se usa para la propiedad.', type:'single', opts:STD},
    {id:'s5_sea', q:'Was there a small estate affidavit?', q_es:'¿Había una declaración jurada de patrimonio pequeño?', type:'single', opts:STD},
    {id:'s5_orders', q:'Were any court orders issued?', q_es:'¿Se emitieron órdenes judiciales?', type:'single', opts:STD},
    {id:'s5_disagree', q:'Is there disagreement among family members?', q_es:'¿Hay desacuerdo entre los familiares?', type:'single', opts:STD},
    {id:'s5_multi', q:'Are there multiple people who might be heirs?', q_es:'¿Hay varias personas que podrían ser herederos?', type:'single', opts:STD},
    {id:'s5_tax', q:'Are the property taxes current or delinquent?', q_es:'¿Los impuestos de la propiedad están al corriente o atrasados?', type:'single', opts:TAX},
   ]},
 { key:'s6', title:'Family & Heirship Context', title_es:'Contexto familiar y de herederos',
   intro:'We can\'t decide who the heirs are — only an attorney or court can. These questions just help us point you to the right questions and records.',
   intro_es:'No podemos decidir quiénes son los herederos — solo un abogado o un tribunal puede. Estas preguntas nos ayudan a orientarle hacia las preguntas y documentos correctos.',
   visibleSec: ownerDeceased,
   qs:[
    {id:'s6_married', q:'Was the deceased owner married?', q_es:'¿El dueño fallecido estaba casado?', type:'single', opts:STD},
    {id:'s6_children', q:'Did the deceased owner have children?', q_es:'¿El dueño fallecido tuvo hijos?', type:'single', opts:STD},
    {id:'s6_childdec', q:'Are any of those children also deceased?', q_es:'¿Alguno de esos hijos también falleció?', type:'single', opts:STD},
    {id:'s6_relatives', q:'Are there grandchildren, siblings, parents, or other relatives who may be involved?', q_es:'¿Hay nietos, hermanos, padres u otros familiares que puedan estar involucrados?', type:'single', opts:STD},
    {id:'s6_oneof', q:'Are you one of several possible heirs?', q_es:'¿Usted es uno de varios posibles herederos?', type:'single', opts:STD},
    {id:'s6_disagree', q:'Does anyone disagree about who should receive the property?', q_es:'¿Alguien no está de acuerdo sobre quién debe recibir la propiedad?', type:'single', opts:STD},
    {id:'s6_paying', q:'Has anyone been paying the taxes, insurance, repairs, or utilities?', q_es:'¿Alguien ha estado pagando los impuestos, seguro, reparaciones o servicios?', type:'single', opts:STD},

/* ---- SCREENER ---- */
function renderScreener(){
  const list = flatQuestions();
  if(step<0) step=0;
  if(step>=list.length){ go('review'); return; }
  const item = list[step];
  const pct = Math.round((step/list.length)*100);
  const v = get(item.id);
  const lbl = T.backNext[L];

  let body='';
  if(item.type==='text'){
    body = `<input type="text" placeholder="${esc(item.ph||'')}" value="${esc(v||'')}" oninput="set('${item.id}', this.value)">`;
  } else if(item.type==='multi'){
    const cur = Array.isArray(v)? v : [];
    body = item.opts.map(o=>{
      const s = cur.includes(o);
      return `<button class="opt ${s?'sel':''}" onclick="toggleMulti('${item.id}', this, ${JSON.stringify(o).replace(/"/g,'&quot;')})">
        <span class="chk">${s?'☑':'☐'}</span>${esc(optLabel(o))}</button>`;
    }).join('');
  } else {
    body = item.opts.map(o=>{
      const s = v===o;
      return `<button class="opt ${s?'sel':''}" onclick="pick('${item.id}', ${JSON.stringify(o).replace(/"/g,'&quot;')})">
        ${s?'<span class="chk">●</span>':''}${esc(optLabel(o))}</button>`;
    }).join('');
  }
  const nextLbl = item.type==='single'? lbl[1] : lbl[2];

  A.innerHTML = `
  <div class="progress-label">${esc(secTitle(item.sec))}</div>
  <div class="progress"><div style="width:${pct}%"></div></div>
  ${item.first? `<div class="notice info">${esc(secIntro(item.sec))}</div>`:''}
  <div class="card">
    <label class="q">${esc(qText(item))}</label>
    ${qHelp(item)? `<div class="help">${esc(qHelp(item))}</div>`:''}
    ${body}
    ${liveFlagNotice()}
    <div class="btn-row no-print">
      <button class="btn btn-ghost" onclick="prev()">${lbl[0]}</button>
      <button class="btn btn-primary" onclick="next()">${nextLbl}</button>
    </div>
  </div>
  <p class="small center no-print">${T.step[L](step+1, list.length)}</p>`;
  scrollTop();
}
function pick(id,val){ set(id,val); next(); }
function toggleMulti(id, el, val){
  let cur = Array.isArray(get(id))? get(id).slice() : [];
  if(cur.includes(val)) cur = cur.filter(x=>x!==val); else cur.push(val);
  set(id,cur);
  el.classList.toggle('sel'); el.querySelector('.chk').textContent = cur.includes(val)?'☑':'☐';
}
function next(){ step++; render(); }
function prev(){ step--; if(step<0){ go('consent'); return;} render(); }

function liveFlagNotice(){
  const f = detectFlags();
  if(f.critical.length || f.high.length){
    return `<div class="notice warn" style="margin-top:14px"><strong>${tr('This may need prompt attention.','Esto puede necesitar atención pronto.')}</strong> ${esc(ESCALATION[L])}</div>`;
  }
  return '';
}

  r.push({k:tr('Property location','Ubicación de la propiedad'), v: [get('s2_addr'), get('s2_county')==='Yes'?tr('Harris County','Condado de Harris'):'', get('s2_kg')==='Yes'?'Kashmere Gardens / SN 52':''].filter(x=>x&&x!=='—').join(' · ')||'—'});

  r.push({k:tr('Occupancy','Ocupación'), v:v('s2_occ')});
  r.push({k:tr('Owner status','Estado del dueño'), v:v('s3_living')});
  if(ownerDeceased(ans)){
    r.push({k:tr('Known will?','¿Testamento conocido?'), v:v('s5_will')});

/* =========================================================================
   PATHWAY ENGINE (issue spotting only; additive A–K)
   ========================================================================= */
function yes(id){ return get(id)==='Yes'; }
function val(id){ return get(id); }

function detectPathways(){
  const p = new Set();
  if(ownerLiving(ans)) p.add('A');
  if(ownerDeceased(ans)){ if(get('s5_will')==='Yes') p.add('B'); else p.add('C'); }
  if(val('s3_living')==='I do not know') p.add('J');
  if(yes('s8_passed')) p.add('D');
  if(yes('s5_multi') || yes('s6_relatives') || yes('s6_oneof')) p.add('E');
  if(yes('s5_disagree') || yes('s6_disagree')) p.add('F');
  if(yes('s9_delinq') || yes('s9_notices') || yes('s9_lawsuit') || yes('s9_sale') || val('s5_tax')==='Delinquent (behind)') p.add('G');
  const goals = get('s11_goals')||[];
  if(yes('s10_repairdenied') || yes('s10_disasterdenied') || goals.includes('Keep the family home') || goals.includes('Repair the property')) p.add('H');
  if(goals.includes('Sell the property')||goals.includes('Transfer the property')||goals.includes('Redevelop the property')) p.add('I');
  if(goals.includes('I do not know where to start')) p.add('J');
  if(get('s2_occ')==='Vacant'||get('s2_occ')==='Abandoned'||get('s2_occ')==='Damaged'||yes('s3_estate')) p.add('K');
  const unknowns = Object.values(ans).filter(x=>x==='I do not know'||x==='I need help finding this').length;
  if(unknowns>=6) p.add('J');
  if(p.size===0) p.add('J');
  return p;
}
function detectFlags(){
  const C=[], H=[];
  const cr=(en,es)=>C.push(tr(en,es)); const hi=(en,es)=>H.push(tr(en,es));
  if(yes('s9_sale')) cr('Foreclosure or tax-sale notice','Aviso de ejecución hipotecaria o venta por impuestos');
  if(yes('s9_lawsuit')) cr('Tax lawsuit / court papers','Demanda por impuestos / documentos judiciales');
  if(yes('s9_notices')) hi('Certified mail / official notices','Correo certificado / avisos oficiales');
  if(yes('s9_delinq')||val('s5_tax')==='Delinquent (behind)') hi('Delinquent taxes','Impuestos atrasados');
  if(yes('s5_disagree')||yes('s6_disagree')) hi('Family disagreement or pressure','Desacuerdo o presión familiar');
  if(yes('s10_displace')) hi('Risk of displacement','Riesgo de desplazamiento');
  if(get('s10_safe')==='No') hi('Home may not be safe to live in','La casa puede no ser segura para vivir');
  if(yes('s10_repairdenied')||yes('s10_disasterdenied')) hi('Assistance denied because of title','Ayuda negada por el título');
  if(yes('s3_estate')) hi('Property listed "in the estate of"','Propiedad listada "in the estate of"');
  return {critical:C, high:H};
}

function buildMeaning(pw, flags){
  const m=[];
  if(flags.critical.length || yes('s9_notices') || yes('s9_delinq'))
    m.push(tr('Because you mentioned a tax notice, delinquency, or court paper, this may be a time-sensitive tax situation that could benefit from prompt review by legal aid or an attorney.','Como mencionó un aviso de impuestos, mora o documento judicial, esta puede ser una situación de impuestos con plazos que podría beneficiarse de una revisión pronta por asistencia legal o un abogado.'));
  if(pw.has('C')) m.push(tr('Because the listed owner has passed away and it is not known whether there was a will or whether probate happened, this may be a situation where ownership records need further review.','Como el dueño falleció y no se sabe si hubo testamento o sucesión, esta puede ser una situación donde los registros de propiedad necesitan más revisión.'));
  if(pw.has('B')) m.push(tr('Because the owner has passed away and a will exists, this may be a situation where the will needs legal review and possibly court action.','Como el dueño falleció y existe un testamento, esta puede ser una situación donde el testamento necesita revisión legal y posiblemente acción judicial.'));
  if(pw.has('E')) m.push(tr('Because several family members may be heirs, this may be a situation where more than one person needs to be involved in decisions about the property.','Como varios familiares pueden ser herederos, esta puede ser una situación donde más de una persona debe participar en las decisiones sobre la propiedad.'));
  if(pw.has('F')) m.push(tr('Because there may be disagreement or pressure, this may be a situation where slowing down and getting records together is helpful before any decision.','Como puede haber desacuerdo o presión, esta puede ser una situación donde conviene ir despacio y reunir documentos antes de cualquier decisión.'));
  if(pw.has('D')) m.push(tr('Because the property may have been passed down without clear paperwork, the public record may not match what the family understands.','Como la propiedad pudo heredarse sin documentos claros, el registro público puede no coincidir con lo que la familia entiende.'));
  if(pw.has('H')) m.push(tr('Because you want to keep and possibly repair the home, title and tax status may affect access to assistance programs.','Como desea conservar y quizá reparar la casa, el título y el estado de impuestos pueden afectar el acceso a programas de ayuda.'));
  if(pw.has('A')) m.push(tr('Because the owner is living, this may be a good time to plan ahead so the property passes down clearly.','Como el dueño vive, este puede ser buen momento para planear para que la propiedad pase con claridad.'));
  if(pw.has('K')) m.push(tr('Because the property may be vacant or listed "in the estate of," public probate, tax, housing, or land bank pathways may be relevant.','Como la propiedad puede estar vacía o listada "in the estate of," pueden ser relevantes vías de sucesión pública, impuestos, vivienda o land bank.'));
  if(m.length===0) m.push(tr('Your answers suggest there may be probate, title, tax, or heirship questions worth reviewing with a professional.','Sus respuestas sugieren que puede haber preguntas de sucesión, título, impuestos o herederos que conviene revisar con un profesional.'));
  return m;
}
function buildRecords(pw){
  const base=[
    {k:tr('The deed','La escritura'), v:tr('Harris County Clerk (real property records — search by address or name).','Secretaría del Condado de Harris (registros de propiedad — busque por dirección o nombre).')},
    {k:tr('HCAD property account','Cuenta de propiedad de HCAD'), v:tr('Harris Central Appraisal District (search by address).','Distrito Central de Tasación de Harris (busque por dirección).')},
    {k:tr('Property tax statement','Estado de cuenta de impuestos'), v:tr('Harris County Tax Assessor-Collector.','Tasador-Recaudador de Impuestos del Condado de Harris.')},
  ];
  if(ownerDeceased(ans)){
    base.push({k:tr('Death certificate','Acta de defunción'), v:tr('Texas vital records or family records.','Registros vitales de Texas o registros familiares.')});
    base.push({k:tr('Will (if any)','Testamento (si existe)'), v:tr('Family members, a safe deposit box, or a prior attorney.','Familiares, una caja de seguridad o un abogado anterior.')});
    base.push({k:tr('Probate records / case number','Registros de sucesión / número de caso'), v:tr('Harris County Probate Courts / County Clerk.','Tribunales de Sucesiones del Condado de Harris / Secretaría del Condado.')});
    base.push({k:tr('Family tree & heir contact list','Árbol familiar y lista de herederos'), v:tr('Build with the family — names, relationships, and contacts.','Hágalo con la familia — nombres, parentescos y contactos.')});
  }
  if(pw.has('G')) base.push({k:tr('Any tax notices / certified letters','Avisos de impuestos / cartas certificadas'), v:tr('Keep every page and note any deadlines.','Guarde cada página y anote cualquier plazo.')});
  if(pw.has('H')) base.push({k:tr('Proof of who pays taxes, insurance, utilities','Prueba de quién paga impuestos, seguro, servicios'), v:tr('Receipts and statements.','Recibos y estados de cuenta.')});
  if(pw.has('E')||pw.has('F')) base.push({k:tr('Records showing family relationships','Documentos de parentesco familiar'), v:tr('Birth/marriage/death records, family agreement if any.','Actas de nacimiento/matrimonio/defunción, acuerdo familiar si existe.')});
  return base;
}

  const o=[];
  if(pw.has('G')||yes('s9_notices')) o.push({k:tr('Harris County Tax Assessor-Collector','Tasador-Recaudador de Impuestos del Condado de Harris'), v:tr('to confirm tax status, ask about payment plans/deferrals, and whether there is a tax suit or sale.','para confirmar el estado de impuestos, preguntar por planes de pago/aplazamientos y si hay demanda o venta por impuestos.')});
  o.push({k:tr('Harris Central Appraisal District (HCAD)','Distrito Central de Tasación de Harris (HCAD)'), v:tr('to look up the property account and check exemptions.','para buscar la cuenta de la propiedad y revisar exenciones.')});
  o.push({k:tr('Harris County Clerk’s Office','Secretaría del Condado de Harris'), v:tr('to search real property records for the deed and recorded documents.','para buscar la escritura y documentos registrados en los registros de propiedad.')});
  if(ownerDeceased(ans)) o.push({k:tr('Harris County Probate Courts','Tribunales de Sucesiones del Condado de Harris'), v:tr('to check whether a probate case was ever opened.','para verificar si se abrió un caso de sucesión.')});
  if(pw.has('K')) o.push({k:tr('Harris County Public Probate Administrator','Administrador Público de Sucesiones del Condado de Harris'), v:tr('may be relevant for certain estates — ask what the office can and cannot do.','puede ser relevante para ciertas sucesiones — pregunte qué puede y qué no puede hacer la oficina.')});
  o.push({k:tr('Legal aid / attorney resources','Asistencia legal / recursos de abogados'), v:'Lone Star Legal Aid, Houston Volunteer Lawyers, Earl Carl Institute'+(flags.critical.length?tr(' — promptly, given the urgent notice.',' — pronto, dado el aviso urgente.'):'.')});
  if(pw.has('I')||pw.has('K')) o.push({k:'Houston Land Bank', v:tr('may be relevant only if program rules and legal review support it.','puede ser relevante solo si las reglas del programa y la revisión legal lo permiten.')});
  return o;
}

function buildNext30(pw, flags){
  const n=[];
  if(flags.critical.length||pw.has('G')){
    n.push(tr('Put any tax notices or certified letters in a folder and write down any deadlines.','Ponga avisos de impuestos o cartas certificadas en una carpeta y anote cualquier plazo.'));
    n.push(tr('Contact the Tax Assessor-Collector to confirm tax status and ask about payment options.','Contacte al Tasador-Recaudador para confirmar el estado de impuestos y preguntar opciones de pago.'));
    n.push(tr('Contact legal aid or a licensed Texas attorney promptly because of the notice.','Contacte asistencia legal o un abogado con licencia pronto por el aviso.'));
  }
  n.push(tr('Look up the HCAD property account online by address.','Busque la cuenta de la propiedad en HCAD por dirección.'));
  n.push(tr('Search for the deed in Harris County real property records (or ask the Clerk for help).','Busque la escritura en los registros de propiedad del Condado de Harris (o pida ayuda a la Secretaría).'));
  if(ownerDeceased(ans)){
    n.push(tr('Ask family members whether there was a will, a trust, or any prior court action.','Pregunte a familiares si hubo testamento, fideicomiso o acción judicial previa.'));
    n.push(tr('Start a simple family tree and heir contact list.','Comience un árbol familiar y lista de herederos sencillos.'));
  }
  n.push(tr('Gather any documents you have in one folder.','Reúna los documentos que tenga en una sola carpeta.'));
  if(pw.has('A')) n.push(tr('Schedule a conversation with a licensed Texas attorney about prevention options, and hold a family conversation about the owner’s wishes.','Programe una conversación con un abogado con licencia sobre opciones de prevención, y hable en familia sobre los deseos del dueño.'));
  return n;
}

<style>
  :root{
    --bg:#FAF7EF; --panel:#ffffff; --panel2:#FAF7EF; --line:#E3DECD;
    --text:#2B2B2B; --muted:#5C6470;
    --brick:#D95448; --grove:#47AB4F; --turq:#00BCC5;
    --navy:#202963; --gold:#D9A441; --accent:#202963; --road:#D7D1C0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  h1,h2,h3,h4,.logo,.welcome h1{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:600;}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none !important}

  header{display:flex;align-items:center;gap:14px;padding:12px 18px;
    background:var(--navy);border-bottom:none;position:sticky;top:0;z-index:50;flex-wrap:wrap}
  .brandmark{display:flex;align-items:center;gap:11px}
  .dots{display:flex;gap:4px}
  .dots i{width:11px;height:11px;border-radius:50%;display:inline-block}
  .logo{font-size:19px;letter-spacing:.2px;line-height:1.1;color:#FAF7EF}
  .logo small{display:block;font-family:Inter;font-weight:600;font-size:10.5px;letter-spacing:.4px;color:rgba(250,247,239,.75);text-transform:uppercase}
  .header-spacer{flex:1}
  .tabs{display:flex;gap:4px;flex-wrap:wrap}

  .tab.active{background:#FAF7EF;border-color:#FAF7EF;color:var(--navy)}
  .iconbtn{background:transparent;border:1px solid rgba(250,247,239,.4);color:#FAF7EF;width:34px;height:34px;border-radius:50%;font-weight:700}
  .iconbtn:hover{border-color:var(--gold)}
  #spectrum{height:4px;background:linear-gradient(90deg,var(--navy),var(--gold))}

  #app{display:block;height:calc(100vh - 59px)}
  .view{display:none;height:100%} .view.active{display:flex}

  .corridor-wrap{flex:1;display:flex;flex-direction:column;min-width:0}
  .corridor-toolbar{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}

  .btn:hover{border-color:var(--gold)}
  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.sm{padding:4px 9px;font-size:11.5px}
  .btn.toggle.active{background:var(--navy);border-color:var(--navy);color:#fff}
  .filter-chip{padding:4px 10px;border-radius:20px;font-size:11.5px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
  .filter-chip.active{background:var(--gold);color:#202963;font-weight:700}
  .filter-chip.zoning.active{background:var(--gold);border-color:var(--gold);color:#202963}

  .scroll{overflow:auto;flex:1;position:relative}
  #schematic{padding:30px 24px;min-width:max-content}
  .corridor-title{font-size:13px;color:var(--muted);margin-bottom:8px}

  .road{height:34px;background:var(--road);border-top:2px dashed #B59A3A;border-bottom:2px dashed #B59A3A;width:100%;display:flex;align-items:center;justify-content:center;color:#6b6450;font-size:11px;letter-spacing:2px}
  .side-row{display:flex;align-items:flex-end;gap:3px;min-height:90px}

  .south .parcel{border-radius:0 0 4px 4px;justify-content:flex-start}

  .parcel.ctx{background:repeating-linear-gradient(45deg,#dcd7c7,#dcd7c7 6px,#d0cab9 6px,#d0cab9 12px)!important;border:1px dashed #9a957f;opacity:.92}
  .parcel.ctx .addr{color:#4b515b;text-shadow:none;font-weight:600}
  .parcel.ctx.green{background:repeating-linear-gradient(45deg,#bfe0c1,#bfe0c1 6px,#a9d3ac 6px,#a9d3ac 12px)!important;border:1px dashed #3f7a43}
  .parcel.ctx.green .addr{color:#234d27;font-size:9px;line-height:1.15}
  .parcel .addr{font-size:10px;font-weight:700;color:rgba(255,255,255,.96);text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap}
  .parcel .pill-badge{position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;border:1px solid #fff}
  .parcel .rd{position:absolute;top:2px;left:3px;font-size:8.5px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
  .parcel .zlab{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
  .parcel .picon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}

  .panel-right{width:344px;min-width:344px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
  .panel-right .scrollin,.map-side .scrollin{overflow:auto;padding:16px}
  .ph{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--navy);margin:18px 0 8px;font-weight:600} .ph:first-child{margin-top:0}
  .kv{font-size:13px;margin:3px 0;color:var(--text)} .kv b{color:var(--muted);font-weight:600}
  .ro-badge{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:1px 6px;margin-left:5px}
  .pillar-btns{display:flex;flex-direction:column;gap:7px}
  .pillar-btn{display:flex;align-items:center;gap:9px;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px;font-weight:600;text-align:left}
  .pillar-btn .dot{width:13px;height:13px;border-radius:50%;flex:none}
  .pillar-btn.active{outline:2px solid var(--text)}
  .outcome-box{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:10px;font-size:12.5px;line-height:1.5}
  .outcome-box h4{margin:0 0 4px;font-size:12px;color:var(--text)} .outcome-box .yr{margin-bottom:8px}
  .impact-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .impact-cell{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px}
  .impact-cell .n{font-size:18px;font-weight:800} .impact-cell .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .empty-hint{color:var(--muted);font-size:13px;line-height:1.6;text-align:center;margin-top:40px}
  .check-row{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:6px 0}
  .check-row input{width:auto}
  .rd-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:800}

  .tally{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2);overflow-x:auto}
  .tally-cell{flex:none;text-align:center;padding:2px 14px;border-right:1px solid var(--line)} .tally-cell:last-child{border-right:none}
  .tally-cell .n{font-size:19px;font-weight:800;color:var(--navy)} .tally-cell .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.5px}
  tr:hover td{background:var(--panel2)}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;font-size:12.5px;font-family:inherit;width:100%}
  textarea{resize:vertical;min-height:48px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .field{margin-bottom:12px} .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
  .pillar-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .pillar-card .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .swatch{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);flex:none;padding:0}
  .assume{background:#FBF1D6;border:1px solid #E7D49E;border-radius:8px;padding:10px 12px;font-size:12px;color:#6b5d2e;margin:0 0 14px;line-height:1.5}

  #map{flex:1;background:#cfc9b8;position:relative}
  .mapstamp{position:absolute;left:6px;bottom:4px;z-index:1200;font-size:10px;color:#2B2B2B;background:rgba(250,247,239,.88);padding:2px 7px;border-radius:4px;pointer-events:none;max-width:70%;line-height:1.3}
  .pillar-pin{font-size:17px;line-height:24px;text-align:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.75));pointer-events:none}
  .map-side{width:344px;min-width:344px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}

  .dash{flex:1;overflow:auto;padding:20px 24px}
  .sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
  .sumcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .sumcard .n{font-size:26px;font-weight:800;color:var(--navy)} .sumcard .l{font-size:12px;color:var(--muted);margin-top:2px}
  .chartgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .chartcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .chartcard h3{margin:0 0 10px;font-size:14px;color:var(--navy)}
  .chartcard canvas{max-height:240px}

  .editwrap{flex:1;overflow:auto;padding:18px 22px}
  .editwrap h2{margin:0 0 4px;font-size:20px;color:var(--navy)} .editwrap p.note{color:var(--muted);font-size:13px;margin:0 0 16px}
  .scn-list{display:flex;flex-direction:column;gap:10px;max-width:560px}
  .scn{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
  .scn .meta{flex:1} .scn .meta b{font-size:14px} .scn .meta span{display:block;color:var(--muted);font-size:11.5px}

  .legend{display:flex;flex-wrap:wrap;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);font-size:11px;color:var(--muted)}
  .legend .li{display:flex;align-items:center;gap:5px} .legend .li i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .narrative{padding:14px 18px;border-top:1px solid var(--line);background:var(--panel2);font-size:13px;line-height:1.6;color:var(--text)}
  .muted{color:var(--muted)} a.maplink{color:var(--navy);font-size:12px}
  .scope-note{font-size:11px;color:var(--muted);padding:6px 14px;background:var(--panel2);border-bottom:1px solid var(--line)}

  .tip{display:inline-block;width:14px;height:14px;line-height:14px;text-align:center;border-radius:50%;background:var(--line);color:var(--muted);font-size:10px;font-weight:800;cursor:help;margin-left:4px;position:relative}
  .tip:hover::after{content:attr(data-tip);position:absolute;left:50%;top:140%;transform:translateX(-50%);background:var(--text);color:#fff;padding:8px 10px;border-radius:8px;font-size:11.5px;font-weight:500;width:220px;z-index:300;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.3)}

  #tourLayer{position:fixed;inset:0;z-index:400;background:rgba(16,28,40,.45)}
  .tour-highlight{position:relative;z-index:401;box-shadow:0 0 0 4px var(--navy),0 0 0 9999px rgba(16,28,40,.45);border-radius:8px}
  #tourCard{position:fixed;z-index:402;max-width:300px;background:var(--panel);border:1px solid var(--navy);border-radius:12px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  #tourCard h4{margin:0 0 6px;font-size:15px} #tourCard p{margin:0 0 12px;font-size:13px;color:var(--text);line-height:1.5}
  #tourCard .row{display:flex;justify-content:space-between;align-items:center}
  #tourCard .step{font-size:11px;color:var(--muted)}

  #printReport{display:none}
  @media print{
    body{background:#fff;color:#000}
    header,#spectrum,#app,#tourLayer,#tourCard{display:none !important}
    #printReport{display:block;padding:24px}
    #printReport h1{font-size:22px;margin:0;font-family:Fraunces,serif} #printReport .accent{color:#202963}
    #printReport table{width:100%;border-collapse:collapse;font-size:12px}
    #printReport th,#printReport td{border:1px solid #ccc;padding:6px;text-align:left;color:#000}
    #printReport img{max-width:100%;border:1px solid #ccc}
    #printReport .dotrule{height:5px;background:linear-gradient(90deg,#202963,#D9A441);margin:8px 0 14px;border-radius:3px}
    #printReport .pcards{display:flex;gap:10px;flex-wrap:wrap}
    #printReport .pc{border:1px solid #ccc;border-radius:8px;padding:10px;min-width:120px}
    #printReport .pc .n{font-size:20px;font-weight:800;color:#202963}
  }
</style>
</head>
<body>

<header id="appHeader">
  <div class="brandmark">
    <div class="logo">W. McNichols Corridor<small>Connecting Dots and Strategies · Prepared for The Kresge Foundation</small></div>
  </div>
  <div class="header-spacer"></div>
  <div class="tabs">
    <button class="tab active" data-view="corridor" onclick="setView('corridor')">Corridor</button>
    <button class="tab" data-view="map" onclick="setView('map')">Map View</button>
    <button class="tab" data-view="dashboard" onclick="setView('dashboard')">Dashboard</button>
    <button class="tab" data-view="scenarios" onclick="setView('scenarios')">Scenarios</button>
    <button class="tab" data-view="pillars" onclick="setView('pillars')">Edit Pillars</button>
  </div>
  <button class="iconbtn" title="Help and guided tour" onclick="startTour(0)">?</button>
</header>
<div id="spectrum"></div>

<div id="app">
  <div class="view active" data-view="corridor">
    <div class="corridor-wrap">
      <div class="tally" id="tally"></div>
      <div class="corridor-toolbar" id="corridorToolbar">
        <span id="saveBtns">
          <button class="btn sm" onclick="exportPDF()">Export PDF</button>
          <button class="btn sm" onclick="exportPNG()">Export PNG</button>
        </span>
        <span style="width:6px"></span>
        <span class="muted" style="font-size:11px">View:</span><span id="filters"></span>
      </div>
      <div class="legend" id="legend"></div>
      <div class="scroll"><div id="schematic"></div></div>
      <div class="narrative" id="narrative"></div>
    </div>
    <div class="panel-right"><div class="scrollin" id="detail"></div></div>
  </div>

  <div class="view" data-view="map">
    <div id="map"><div class="mapstamp" id="mapStamp"></div></div>
    <div class="map-side">
      <div class="corridor-toolbar">
        <span class="muted" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">Layers:</span>
        <button class="btn sm toggle active" id="satBtn" onclick="toggleSat()">Satellite</button>
        <button class="btn sm toggle" id="zoneBtnMap" onclick="toggleZoning()">Zoning</button>
        <button class="btn sm toggle active" id="bldBtn" onclick="toggleBuildings()">Buildings</button>
      </div>
      <div class="scope-note">93 parcels in scope. 24 surrounding parcels shown in grey as context, marked Not in scope.<span id="bldNote"></span></div>
      <div class="scrollin" id="mapDetail" style="flex:1"></div>
    </div>
  </div>

  <div class="view" data-view="dashboard"><div class="dash" id="dash"></div></div>
  <div class="view" data-view="scenarios"><div class="editwrap" id="scnWrap"></div></div>
  <div class="view" data-view="pillars"><div class="editwrap" id="pillarWrap"></div></div>
</div>

<div id="printReport"></div>

const state={parcels:[],context:[],pillars:[],scenarios:[],assume:{costFactor:1.0,valueFactor:1.0,taxRate:0.034},filter:"all",colorMode:"use",selected:null,view:"corridor"};
const LS_KEY="cds_mcnichols_demo_v2";

function persist(){try{
  const a={},co={};state.parcels.forEach(p=>{if(p.pillar)a[p.id]=p.pillar;if(p.costOverride!=null)co[p.id]=p.costOverride;});
  localStorage.setItem(LS_KEY,JSON.stringify({a,co,pillars:state.pillars,assume:state.assume,scenarios:state.scenarios}));
}catch(e){}}
function restore(){try{
  const o=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(!o)return;
  if(o.pillars&&o.pillars.length){state.pillars=o.pillars;state.pillars.forEach(p=>{const n=parseInt((p.id||"").replace(/\D/g,""));if(n>_pid)_pid=n;});}
  if(o.assume)state.assume={...state.assume,...o.assume};
  state.parcels.forEach(p=>{if(o.a&&o.a[p.id])p.pillar=o.a[p.id];if(o.co&&o.co[p.id]!=null)p.costOverride=o.co[p.id];});
  state.scenarios=o.scenarios||[];
  (state.scenarios||[]).forEach(s=>{const n=parseInt((s.id||"").replace(/\D/g,""));if(n>_sid)_sid=n;});
}catch(e){}}

function init(){
  state.parcels=buildParcels();
  state.context=buildContext();
  state.pillars=defaultPillars();
  document.querySelectorAll(".mapstamp").forEach(el=>el.textContent=STAMP);
  restore();

}
function buildReport(){
  const total=state.parcels.length;
  const withGeom=state.parcels.filter(p=>p.rings&&p.rings.length).length;
  const ctx=state.context.length;
  console.log("%cW. McNichols Corridor demo · build report","font-weight:bold");
  console.log("In-scope parcels loaded: "+total+" (expected 93)");
  console.log("In-scope parcels with polygon geometry: "+withGeom+" of "+total);
  console.log("Context (not in scope) parcels loaded: "+ctx+" (expected 25, including Marygrove)");
  const missing=state.parcels.filter(p=>!p.rings||!p.rings.length).map(p=>p.address);
  if(missing.length)console.warn("Parcels missing geometry (will not draw on map): "+missing.join(", "));
  if(total!==93)console.warn("Expected 93 in-scope parcels, found "+total);
  console.log("OFFLINE BACKUP build: Leaflet, Chart.js, and html2canvas are embedded in this file. Only satellite imagery, building footprints, and the display fonts need internet; everything else works offline.");
}

      `<span class="li muted">All in-scope parcels are zoned B2 (local business). Reference data.</span>`+NIS_LI;

function renderFilters(){

function setFilter(v){state.filter=v;renderFilters();renderSchematic();}
function toggleZoning(){

function passFilter(p){if(state.filter==="all")return true;if(state.filter==="vacant")return p.use==="Vacant";if(state.filter==="committed")return !!p.pillar;if(state.filter.startsWith("pillar:"))return p.pillar===state.filter.split(":")[1];return true;}


function parcelColor(p){
  if(state.colorMode==="zoning")return zoneColor(p.zoning);
  if(p.pillar){const pl=state.pillars.find(x=>x.id===p.pillar);if(pl)return pl.color;}

}
function widthFor(p){return Math.max(34,(Number(p.frontage)||40)*1.1);}
function heightFor(p){const s=Number(p.sqft)||3000;return Math.max(46,Math.min(120,s/420));}
function renderSchematic(){

    const sel=state.selected===p.id?"selected":"",vac=p.use==="Vacant"?"vacant":"";
    const badge=p.pillar?`<span class="pill-badge" style="background:${(state.pillars.find(x=>x.id===p.pillar)||{}).color}"></span>`:"";
    const center=zmode?`<span class="zlab">${p.zoning||""}</span>`:(p.pillar?`<span class="picon">${(state.pillars.find(x=>x.id===p.pillar)||{}).icon||""}</span>`:"");
    return `<div class="parcel ${sel} ${vac}" style="width:${widthFor(p)}px;height:${heightFor(p)}px;background:${parcelColor(p)}" onclick="selectParcel('${p.id}')" title="${p.address} W. McNichols · ${p.use}">${badge}${center}<div class="addr">${p.address}</div></div>`;
  };
  const ctxCell=c=>{
    if(state.filter!=="all")return `<div style="width:${widthFor(c)}px;opacity:.12"></div>`;

    if(c.kind==="green")return `<div class="parcel ctx green ${sel}" style="width:175px;height:74px" onclick="selectParcel('${c.id}')" title="${c.name} · Not in scope"><div class="addr" style="white-space:normal">${c.name}<br>not in scope</div></div>`;
    return `<div class="parcel ctx ${sel}" style="width:${widthFor(c)}px;height:60px" onclick="selectParcel('${c.id}')" title="${c.address} W. McNichols · Not in scope"><div class="addr">${c.address}</div></div>`;
  };
  const items=[...state.parcels.map(o=>({k:"p",o,num:Number(o.address)})),...state.context.map(o=>({k:"c",o,num:Number(o.address)}))].sort((a,b)=>a.num-b.num);
  const render=it=>it.k==="p"?cell(it.o):ctxCell(it.o);
  const north=items.filter(it=>it.o.side!=="S").map(render).join("");
  const south=items.filter(it=>it.o.side==="S").map(render).join("");
  document.getElementById("schematic").innerHTML=`<div class="corridor-title">${CORRIDOR} · ${CITY} · ${state.parcels.length} parcels in scope · ${state.context.length} shown for context</div>

function impactFor(p,pl){const sqft=Number(p.sqft)||0;return pl.metrics.map(m=>{
  let f=Number(m.factor)||0;
  const value=m.money?sqft*f:(f>0?Math.floor(sqft/f):0);
  return {label:m.label,money:m.money,value};
});}
function parcelCost(p,pl){const cps=(p&&p.costOverride!=null)?Number(p.costOverride):(Number(pl.cost)||0);return (Number(p.sqft)||0)*cps*(state.assume.costFactor||1);}
function fmt(v,money){return money?"$"+Math.round(v).toLocaleString():Math.round(v).toLocaleString();}

function committedParcels(){return state.parcels.filter(p=>p.pillar&&state.pillars.find(x=>x.id===p.pillar));}
function aggregateOutcomes(list){const t={};list.forEach(p=>{const pl=state.pillars.find(x=>x.id===p.pillar);if(!pl)return;impactFor(p,pl).forEach(m=>{t[m.label]=t[m.label]||{v:0,money:m.money};t[m.label].v+=m.value;});});return t;}
function totalInvestment(list){return list.reduce((a,p)=>{const pl=state.pillars.find(x=>x.id===p.pillar);return a+(pl?parcelCost(p,pl):0);},0);}
function renderTally(){
  const list=committedParcels(),t=aggregateOutcomes(list);
  let cells=`<div class="tally-cell"><div class="n">${list.length}</div><div class="l">Parcels assigned</div></div>`;
  cells+=`<div class="tally-cell"><div class="n">${fmt(totalInvestment(list),true)}</div><div class="l">Est. investment</div></div>`;
  cells+=Object.entries(t).map(([l,o])=>`<div class="tally-cell"><div class="n">${fmt(o.v,o.money)}</div><div class="l">${l}</div></div>`).join("");
  if(list.length===0)cells=`<div class="tally-cell"><div class="n">0</div><div class="l">Parcels assigned</div></div><div class="tally-cell" style="border:none"><div class="l" style="padding-top:6px">Assign parcels to pillars to build cumulative outcomes</div></div>`;
  document.getElementById("tally").innerHTML=cells;
}
function renderNarrative(){

  if(!list.length){el.innerHTML=`<span class="muted">Click any parcel, choose a pillar, and a live revitalization summary builds here.</span>`;return;}
  const t=aggregateOutcomes(list);const parts=Object.entries(t).map(([l,o])=>`${fmt(o.v,o.money)} ${l.toLowerCase()}`);

}

function setCost(pid,v){const p=state.parcels.find(x=>x.id===pid);p.costOverride=(v===""||v==null)?null:(Number(v)||0);renderAll();if(state.view==="map"){renderMap();renderMapDetail();}}

       <div class="field" style="margin:0"><label>Value factor (value / investment)</label><input type="number" step="0.05" value="${state.assume.valueFactor}" onchange="setAssume('valueFactor',this.value)" style="width:130px"></div>

function chartOpts(prefix){return {plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#5C6470",font:{size:9}},grid:{display:false}},y:{ticks:{color:"#5C6470",font:{size:9},callback:v=>(prefix==="$"?"$":"")+v.toLocaleString()},grid:{color:"#E2DCC8"}}}};}
function renderAmiTable(){const el=document.getElementById("amiTable");if(!el)return;const ami=AMI_VALUE;

function snapshotAssignments(){const a={};state.parcels.forEach(p=>{if(p.pillar)a[p.id]=p.pillar;});return a;}
function exportScenarios(){
  const data=JSON.stringify({version:TOOL_VERSION,scenarios:state.scenarios,assume:state.assume},null,2);
  const b=new Blob([data],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="W-McNichols-scenario-share.json";a.click();
}
function applyImportedScenarios(d){
  if(!d||typeof d.version!=="string"||!d.version.startsWith("2")||!Array.isArray(d.scenarios))return -1;
  const names=new Set(state.scenarios.map(s=>s.name));let added=0;
  d.scenarios.forEach(s=>{
    if(!s||typeof s.name!=="string"||typeof s.assignments!=="object"||s.assignments===null)return;
    let name=s.name;if(names.has(name))name=name+" (imported)";
    names.add(name);
    state.scenarios.push({id:s_id(),name,date:s.date||"imported",assignments:{...s.assignments}});
    added++;
  });
  if(d.assume&&typeof d.assume==="object")state.assume={...state.assume,...d.assume};
  persist();
  return added;
}
function importScenarios(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    let d;try{d=JSON.parse(e.target.result);}catch(err){alert("Could not read that file. It is not valid JSON.");return;}
    const added=applyImportedScenarios(d);
    if(added<0){alert("That file is not a scenarios export from this tool (version 2).");return;}
    renderScenarios();
    alert("Imported "+added+" scenario"+(added===1?"":"s")+".");
  };
  r.readAsText(file);
}
function saveScenario(){const name=prompt("Name this scenario (e.g. Housing-first, Mixed):","Scenario "+(state.scenarios.length+1));if(!name)return;state.scenarios.push({id:s_id(),name,date:new Date().toLocaleDateString(),assignments:snapshotAssignments()});renderScenarios();persist();}
function applyScenario(id){const s=state.scenarios.find(x=>x.id===id);if(!s)return;state.parcels.forEach(p=>{p.pillar=s.assignments[p.id]||null;});renderAll();alert("Loaded scenario: "+s.name);}
function delScenario(id){if(!confirm("Delete this scenario?"))return;state.scenarios=state.scenarios.filter(x=>x.id!==id);renderScenarios();persist();}
function miniStrip(assignments){
  const sorted=[...state.parcels].sort((a,b)=>Number(a.address)-Number(b.address));
  const cell=p=>{
    const pl=assignments[p.id]?state.pillars.find(x=>x.id===assignments[p.id]):null;
    const col=pl?pl.color:"#E3DECD";
    const w=Math.max(2,Math.round((Number(p.frontage)||40)*0.09));

  };

let map,osm,sat,satOn=true,inLayer,ctxLayer;
function ensureMap(){if(map)return;

  ctxLayer=L.layerGroup().addTo(map);

  if(all.length){const la=all.map(p=>p[0]),lo=all.map(p=>p[1]);map.fitBounds([[Math.min(...la),Math.min(...lo)],[Math.max(...la),Math.max(...lo)]]);}else{const b=DATA.bbox;map.fitBounds([[b[0],b[1]],[b[2],b[3]]]);}
  loadBuildings();
}
let bldLayer=null,bldOn=true,bldTried=false,bldSource="";
const BLD_CACHE_KEY="cds_mcnichols_bld_cache_v1";
function toggleBuildings(){
  bldOn=!bldOn;const btn=document.getElementById("bldBtn");if(btn)btn.classList.toggle("active",bldOn);
  if(bldLayer){if(bldOn)map.addLayer(bldLayer);else map.removeLayer(bldLayer);}
}
function updateBldNote(){const el=document.getElementById("bldNote");if(!el)return;
  el.textContent=bldSource?(" Building outlines: "+bldSource+".")
    :" Building outlines could not load (needs internet).";}
function addBuildings(geoms,src,store){
  bldSource=src;bldLayer=L.layerGroup();let n=0;
  geoms.forEach(g=>{
    if(!g||!g.coordinates)return;
    const polys=g.type==="MultiPolygon"?g.coordinates:[g.coordinates];
    polys.forEach(rings=>{
      if(!rings||!rings[0])return;
      const latlngs=rings.map(ring=>ring.map(c=>[c[1],c[0]]));
      L.polygon(latlngs,{color:"#101C28",weight:1,opacity:.75,fillColor:"#101C28",fillOpacity:.07,interactive:false}).addTo(bldLayer);n++;
    });
  });
  if(bldOn&&map)bldLayer.addTo(map);
  console.log("Building footprints loaded: "+n+" ("+src+")");
  updateBldNote();
  if(store){try{localStorage.setItem(BLD_CACHE_KEY,JSON.stringify({src:src,geoms:geoms}));}catch(e){}}
}
function bldCentroid(g){
  try{
    const ring=(g.type==="MultiPolygon"?g.coordinates[0][0]:g.coordinates[0]);
    let la=0,lo=0;ring.forEach(c=>{lo+=c[0];la+=c[1];});
    return [la/ring.length,lo/ring.length];
  }catch(e){return null;}
}
async function loadBuildings(){
  if(bldTried||!map)return;bldTried=true;
  try{
    const c=JSON.parse(localStorage.getItem(BLD_CACHE_KEY)||"null");
    if(c&&Array.isArray(c.geoms)&&c.geoms.length){addBuildings(c.geoms,(c.src||"saved data")+" (saved copy)",false);return;}
  }catch(e){}
  const b=DATA.bbox;
  const got=[],srcs=[];
  const esriQ="/query?where=1%3D1&geometry="+b[1]+","+b[0]+","+b[3]+","+b[2]+"&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&returnGeometry=true&outFields=&outSR=4326&f=geojson";
  const arcgisCandidates=[
    "https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/Buildings/FeatureServer/0",
    "https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/Building_Footprints/FeatureServer/0",
    "https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/building_footprints/FeatureServer/0"
  ];
  for(const base of arcgisCandidates){
    try{
      const r=await fetch(base+esriQ);const j=await r.json();
      if(j&&j.features&&j.features.length){got.push(...j.features.map(x=>x.geometry).filter(Boolean));srcs.push("City of Detroit open data");break;}
    }catch(e){}
  }
  const q='[out:json][timeout:40];way["building"]('+b[0]+','+b[1]+','+b[2]+','+b[3]+');out geom;';
  const overpassMirrors=[
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter",
    "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
  ];
  for(const mirror of overpassMirrors){
    try{
      const r=await fetch(mirror+"?data="+encodeURIComponent(q));
      const j=await r.json();
      const geoms=(j.elements||[]).filter(e=>e.type==="way"&&e.geometry&&e.geometry.length>2).map(e=>({type:"Polygon",coordinates:[e.geometry.map(g=>[g.lon,g.lat])]}));
      if(geoms.length){
        if(!got.length){got.push(...geoms);}
        else{
          const cents=got.map(bldCentroid).filter(Boolean);
          let added=0;
          geoms.forEach(g=>{
            const c=bldCentroid(g);if(!c)return;
            const dup=cents.some(e=>Math.abs(e[0]-c[0])<0.00006&&Math.abs(e[1]-c[1])<0.00008);
            if(!dup){got.push(g);cents.push(c);added++;}
          });
          console.log("OpenStreetMap supplement: "+added+" footprints added that the city layer lacked.");
        }
        srcs.push("OpenStreetMap");break;
      }
    }catch(e){}
  }
  if(got.length){addBuildings(got,srcs.join(" + "),true);return;}
  console.warn("Building footprints could not be loaded from Detroit open data or OpenStreetMap.");
  const btn=document.getElementById("bldBtn");
  if(btn){btn.disabled=true;btn.classList.remove("active");btn.textContent="Buildings unavailable";}
  updateBldNote();
}

function renderMap(){if(!map)return;

    const sel=state.selected===c.id;
    const poly=L.polygon(ring,{color:sel?"#101C28":(green?"#2f6e34":"#8a8676"),weight:sel?2:1,fillColor:green?"#7fc184":"#b9b4a3",fillOpacity:green?.5:.4});

    poly.bindTooltip(`${green?c.name:(c.address+" W. McNichols")} · Not in scope`,{sticky:true});
    poly.addTo(ctxLayer);
  });if(c.rings&&c.rings.length)drawnCtx++;});
  let drawnIn=0;
  const parcelCentroid=p=>{const pts=[];(p.rings||[]).forEach(r=>r.forEach(pt=>pts.push(pt)));if(!pts.length)return null;
    return [pts.reduce((a,x)=>a+x[0],0)/pts.length,pts.reduce((a,x)=>a+x[1],0)/pts.length];};
  state.parcels.forEach(p=>{

      }
    }
    drawnIn++;
  });
  console.log("Map render: "+drawnIn+" in-scope polygons drawn, "+drawnCtx+" context parcels drawn.");
  if(drawnIn!==state.parcels.length)console.warn("Only "+drawnIn+" of "+state.parcels.length+" in-scope parcels drew on the map.");
  renderMapDetail();
}

function addMetric(id){state.pillars.find(x=>x.id===id).metrics.push({label:"New metric",factor:1000});renderPillarEditor();persist();}
function delMetric(id,i){state.pillars.find(x=>x.id===id).metrics.splice(i,1);renderPillarEditor();renderTally();renderDetail();persist();}
function addPillar(){state.pillars.push({id:p_id(),name:"New Pillar",color:"#7aa2c4",icon:"⭐",cost:150,metrics:[{label:"Jobs",factor:2000}],y1:"",y2:"",lt:""});renderPillarEditor();renderFilters();persist();}
function delPillar(id){if(!confirm("Delete this pillar?"))return;state.parcels.forEach(p=>{if(p.pillar===id)p.pillar=null;});state.pillars=state.pillars.filter(x=>x.id!==id);renderPillarEditor();renderAll();}

init();
</script>
